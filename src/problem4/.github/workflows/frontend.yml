name: Frontend CI/CD

on:
  pull_request:
    branches: [main]
    paths: [frontend/**, .github/workflows/frontend.yml]
  push:
    branches: [main]
    paths: [frontend/**, .github/workflows/frontend.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  AWS_REGION: ${{ vars.AWS_REGION }}
  FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
  API_BASE_URL: ${{ vars.API_BASE_URL }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, test, build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: dist
      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy static site
        run: |
          test -n "$FRONTEND_BUCKET" && test -n "$API_BASE_URL"
          aws s3 sync dist "s3://$FRONTEND_BUCKET" --delete --exclude '.DS_Store' --cache-control 'public,max-age=300' --no-progress
          aws s3 cp dist/index.html "s3://$FRONTEND_BUCKET/index.html" --cache-control 'no-cache' --content-type 'text/html; charset=utf-8' --no-progress
          aws s3 cp dist/config.js "s3://$FRONTEND_BUCKET/config.js" --cache-control 'no-cache' --content-type 'application/javascript; charset=utf-8' --no-progress
      - name: Invalidate CloudFront
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths '/*' --output table
      - name: Record deployment summary
        run: |
          {
            echo '### Frontend production deployment'
            echo 'Commit: ${{ github.sha }}'
            echo "Target: s3://$FRONTEND_BUCKET"
            echo 'Rollback: redeploy a known-good commit; enable S3 versioning for object-level recovery.'
          } >> "$GITHUB_STEP_SUMMARY"
